services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-operations}
      MYSQL_USER: ${MYSQL_USER:-operations}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    env_file: .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      HOST: 0.0.0.0
      PORT: 3000
      UPLOAD_DIR: /app/private-uploads
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - document-data:/app/private-uploads
      - backup-data:/app/backups
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql-data:
  document-data:
  backup-data:
